server {
    listen 80;
    listen [::]:80;
    server_name helstera.com;
    return 301 https://ai.0st.top$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name helstera.com;
    # Keep the old host's TLS certificate active so the redirect works before HTTP is followed.
    return 301 https://ai.0st.top$request_uri;
    index index.html;
    root /www/wwwroot/helstera.com;
    include /www/server/panel/vhost/nginx/extension/helstera.com/*.conf;

    ssl_certificate /etc/letsencrypt/live/helstera.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/helstera.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5:!DH:!DH:!DH;
    ssl_prefer_server_ciphers on;

    location ~* (\.user.ini|\.htaccess|\.htpasswd|\.env\.|composer\.) {
        return 404;
    }
    location ~ /\.(sql|log)$ {
        return 404;
    }
    location ~* /\.git|\.svn|node_modules|runtime/ {
        return 404;
    }

    location ~* \.(html|htm|css|js|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /www/wwwlogs/helstera.com.log;
    error_log /www/wwwlogs/helstera.com.error.log;
}
